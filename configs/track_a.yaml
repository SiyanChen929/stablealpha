factor_search:
  levels: 7
  roles: 21
  initial_population: 80
  parent_pool: 32
  children_per_generation: 96
  generations: 24
  subcycles: 3
  generations_per_subcycle: 8
  elite_carry: 2
  final_factors: 20
  codex_feedback_each_generation: true
  feedback_fields:
    - rejection_class
    - train_raw_rank_ic
    - validation_raw_rank_ic
    - validation_neutral_rank_ic
    - stability
    - novelty
    - turnover
    - parent_delta
  sealed_feedback: forbidden
  semantic_repair: realtime_from_sanitized_feedback
  parent_pairing: minimum_validation_residual_rank_correlation_within_quality_pool
  selection:
    algorithm: deterministic_nsga2
    objectives_maximize:
      - raw_rank_ic
      - neutral_rank_ic
      - stability
      - novelty
      - turnover_efficiency
      - parent_delta
    hard_constraints:
      minimum_coverage: 0.70
      predeclared_direction: true
      price_scale_invariance: true
      chronological_only: true

python_factor_sandbox:
  representation: single_factor_ctx_function
  execution_mode: ast_lowering_without_exec_or_eval
  network: denied
  filesystem: no_generated_code_access
  data: read_only_in_memory_view
  max_source_bytes: 16384
  max_ast_nodes: 256
  cpu_seconds_per_worker: 7200
  memory_bytes_per_worker: 8589934592
  workers: 3
  audited_extensions:
    - ts_spectral_ratio
    - ts_cusum
    - ts_sign_entropy
    - ts_state_transition
    - cs_residual

factor_metrics:
  paper_primary: raw_daily_spearman_rank_ic
  neutralization_in_paper_primary: false
  development_secondary:
    - industry_and_style_neutral_rank_ic
    - hac_icir
    - moving_block_bootstrap_lower_bound
    - turnover
    - novelty
    - parent_and_linear_control_delta

models:
  refit_schedule_trading_days: 126
  refit_training_window: expanding_past_only
  refit_label_purge_trading_days: 11
  feature_transform: daily_cross_sectional_rank_normalization
  sample_weight: equal_date_weight
  ridge:
    alpha: 10.0
    fit_intercept: true
  lightgbm:
    objective: regression
    learning_rate: 0.0001
    n_estimators: 1000
    num_leaves: 32
    max_depth: 12
    reg_alpha: 1.0
    reg_lambda: 1.0
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    deterministic: true
    force_col_wise: true
    n_jobs: 3
    random_state: 17
  unresolved_paper_defaults:
    - min_child_samples
    - boosting_type
    - exact_early_stopping_behavior

portfolio:
  rebalance: daily
  selection: top_50
  drop: 5
  entry_price: next_open
  benchmark: CSI300
  initial_capital_cny: 1000000
  board_lot: 100
  open_cost_rate: 0.0005
  close_cost_rate: 0.0015
  minimum_commission_cny: 5.0
  stamp_duty_in_close_cost: included_as_paper_aggregate
  execution_fail_closed_on:
    - suspension
    - price_limit
    - missing_open

reproducibility:
  seed: 17
  pyqlib_version: 0.9.7
  freeze_before_search:
    - config_sha256
    - source_manifest_sha256
    - implementation_sha256
    - seed_factor_cards_sha256
    - test_date_hash
  persist_every_candidate: true
  persist_every_failure: true
  persist_sanitized_feedback: true
  persist_codex_generation_response: true
  persist_lineage: true
  one_time_test_reveal: true

known_non_parity:
  - author_runtime_code_not_public
  - author_exact_dataset_snapshot_not_public
  - author_model_checkpoint_gpt_oss_120b_not_used
  - author_complete_generated_factor_archive_not_public
